<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c4aa93"><title>LÚMINA | Showroom 3D</title>
<style>
:root{color-scheme:light;--cream:#fff0d4;--brown:#3e332d;--dim:#6e5a4c;--glass:rgba(255,246,229,.82)}*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--brown)}
body{background:#c6ad96}button{font:inherit;cursor:pointer}.showroom{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse 75% 70% at 52% 28%,#f5d9b5 0,#d9b99b 48%,#b3937b 100%)}
.showroom::before{content:"";position:absolute;inset:0 0 12%;background:linear-gradient(90deg,transparent 0 76%,rgba(93,68,53,.19) 76.1%,rgba(255,251,237,.23) 76.6%,transparent 77.1%),repeating-linear-gradient(90deg,transparent 0 95px,rgba(122,91,70,.075) 96px,transparent 99px);opacity:.6}
.ceiling{position:absolute;top:-18vh;left:-13vw;width:126vw;height:42vh;background:linear-gradient(175deg,#e9d4be,#dcc0a5);border-radius:0 0 50% 30%;box-shadow:0 4px 28px #ac82634d}
.arch{position:absolute;left:-18%;top:-12%;width:65%;height:127%;border:26px solid rgba(255,235,209,.39);border-radius:52% 52% 0 0;filter:drop-shadow(0 0 10px #ffddae80);pointer-events:none}
.arch::after{content:"";position:absolute;inset:-12px;border:2px solid rgba(255,230,172,.74);border-radius:inherit;box-shadow:0 0 12px #ffddaf}
.pillar{position:absolute;right:5%;top:0;height:100%;width:5.5%;background:repeating-linear-gradient(90deg,#ae8a71 0 4px,#d2b399 5px 12px,#b1907a 13px 16px);opacity:.5;box-shadow:-16px 0 32px #84604e38}
.floor{position:absolute;bottom:-10%;left:-20%;width:140%;height:29%;transform:skewY(-3deg);background:linear-gradient(155deg,#ddc7ad,#aa8e78);box-shadow:0 -12px 40px #9a78643a}
.pedestal{position:absolute;left:-3%;bottom:0;width:23%;height:18%;border-radius:50% 50% 0 0 / 20% 20% 0 0;background:linear-gradient(110deg,#d2b9a0,#f3ddbe 30%,#bba089 88%);box-shadow:12px -14px 36px #8f695d36}
.decor{position:absolute;left:7%;bottom:14%;width:7px;height:24%;transform:rotate(-12deg);background:#856e4d;box-shadow:12px -8px 0 -1px #a28a63,-13px -5px 0 -1px #a28a63;opacity:.5}
.decor::before{content:"";position:absolute;left:-28px;top:-34px;width:65px;height:90px;background:radial-gradient(ellipse at 45% 25%,#ddd0a3 0 2px,transparent 3px),radial-gradient(ellipse at 55% 53%,#f4dba6 0 3px,transparent 4px),radial-gradient(ellipse at 34% 72%,#e7caa2 0 3px,transparent 4px);background-size:23px 24px}
#viewer{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}#viewer:active{cursor:grabbing}
.topbar{position:absolute;z-index:4;top:27px;left:clamp(20px,4vw,70px);right:clamp(20px,4vw,70px);display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{font-size:21px;letter-spacing:.34em;font-weight:650}.nav-note{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6b5543}
.caption{position:absolute;z-index:4;left:clamp(20px,4vw,70px);top:22%;max-width:260px;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.24em;font-weight:700;text-transform:uppercase;color:#82644c}.caption h1{font-size:clamp(27px,3vw,46px);line-height:1.09;font-weight:450;letter-spacing:-.05em;margin:12px 0}.caption p{font-size:14px;line-height:1.7;color:#775f50}
.controls{position:absolute;z-index:5;bottom:clamp(20px,4vh,48px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px;border:1px solid #fff9;border-radius:22px;background:var(--glass);backdrop-filter:blur(18px);box-shadow:0 18px 55px #6f4c3436;max-width:calc(100vw - 30px)}.button{border:1px solid transparent;border-radius:15px;background:transparent;color:#654e3c;padding:12px 15px;white-space:nowrap;transition:.18s}.button:hover{background:#fff9}.button.active{background:#594737;color:#fff3dc;box-shadow:0 3px 12px #6b4a3333}.separator{width:1px;height:27px;background:#b9a28d99;margin:0 3px}.brightness{display:flex;align-items:center;gap:9px;padding:0 12px;font-size:12px;white-space:nowrap}.brightness input{accent-color:#7d5940;width:85px}.power{width:42px;height:42px;border-radius:14px;border:0;background:#f0deca;color:#5c4434;font-size:20px}.power.off{background:#bca99a;color:#eee}.corner-note{position:absolute;right:25px;bottom:16px;color:#624a3a;font-size:11px;opacity:.75}#status{position:absolute;top:77px;right:4vw;font-size:12px;color:#694a37}.hint{position:absolute;bottom:115px;left:50%;transform:translateX(-50%);font-size:12px;color:#684f3d;white-space:nowrap;opacity:.77}
@media(max-width:740px){.nav-note{display:none}.caption{top:95px;max-width:190px}.caption h1{font-size:28px}.caption p{font-size:12px}.controls{bottom:20px;width:calc(100% - 24px);flex-wrap:wrap;justify-content:center;gap:4px}.button{padding:10px 11px;font-size:12px}.brightness{padding:0 5px}.brightness input{width:65px}.hint{bottom:128px}.corner-note{display:none}.brand{font-size:16px}.arch{left:-56%;width:110%}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<div class="showroom"><div class="ceiling"></div><div class="arch"></div><div class="pillar"></div><div class="floor"></div><div class="pedestal"></div><div class="decor"></div></div>
<canvas id="viewer" aria-label="Visor tridimensional de luminaria LED de tres aros"></canvas>
<div class="topbar"><div class="brand">LÚMINA<span style="color:#8a6a53">.</span></div><div class="nav-note">Colección de iluminación · Vista 3D</div></div>
<div class="caption"><div class="eyebrow">Luminaria suspendida / 001</div><h1>La luz en<br><em>movimiento.</em></h1><p>Tres aros luminosos, infinitas posibilidades de diseño.</p></div>
<div id="status">Cargando modelo 3D…</div><div class="hint">Arrastra para girar · Rueda para acercar</div>
<div class="controls"><button type="button" class="button active" id="btn-horizontal" aria-pressed="true">◎ Horizontal</button><button type="button" class="button" id="btn-diagonal" aria-pressed="false">◈ Vista diagonal</button><div class="separator"></div><button type="button" class="power" id="power" aria-label="Apagar iluminación" title="Encender o apagar">⏻</button><label class="brightness">Brillo <input type="range" id="brightness" min="0" max="3" step="0.05" value="1.65"></label><button type="button" class="button" id="reset">↺ Reiniciar</button></div>
<div class="corner-note">Modelo conceptual · Previsualización, no simulación fotométrica</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const canvas=document.querySelector('#viewer');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.42;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.08,100);
camera.up.set(0,0,1);camera.position.set(4.15,-6.2,3.6);
const controls=new OrbitControls(camera,canvas);controls.target.set(0,0,1.62);controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=2;controls.maxDistance=11;controls.maxPolarAngle=Math.PI*.86;controls.minPolarAngle=.15;
scene.add(new THREE.AmbientLight('#ffe9d3',2.0));
const key=new THREE.DirectionalLight('#fff5e6',3.0);key.position.set(-4,-3,6);scene.add(key);
const fill=new THREE.DirectionalLight('#c1b1a6',1.1);fill.position.set(4,4,3);scene.add(fill);
let powered=true,ledMaterials=[],currentMode='horizontal',targetMode='horizontal',rings=[],cables=[],glowLights=[];
const ringSpecs=[{r:.72,z:1.67,count:8,offset:Math.PI/12,top:.135},{r:.55,z:1.13,count:6,offset:Math.PI/12+.17,top:.09},{r:.38,z:.62,count:4,offset:Math.PI/12+.34,top:.053}];
const cableMaterial=new THREE.MeshStandardMaterial({color:'#a89c91',metalness:.85,roughness:.32});
const cableGeom=new THREE.CylinderGeometry(.0019,.0019,1,6);
const yAxis=new THREE.Vector3(0,1,0);
const diagonalRot=[[-.23,.21],[-.36,-.25],[.32,.28]];
function setCylinder(mesh,a,b){const diff=b.clone().sub(a);mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(yAxis,diff.clone().normalize());mesh.scale.set(1,diff.length(),1);}
function layoutRing(index){const spec=ringSpecs[index],group=rings[index];if(!group)return;
  const angle= targetMode==='diagonal' ? diagonalRot[index] : [0,0];
  group.userData.tx=angle[0];group.userData.ty=angle[1];
}
function updateCables(){for(const c of cables){const spec=ringSpecs[c.ring],grp=rings[c.ring];if(!grp)continue;
  const a=new THREE.Vector3(spec.top*Math.cos(c.theta),spec.top*Math.sin(c.theta),2.947);
  const b=new THREE.Vector3((spec.r-.018)*Math.cos(c.theta),(spec.r-.018)*Math.sin(c.theta),.016).applyQuaternion(grp.quaternion).add(grp.position);
  setCylinder(c.mesh,a,b);
}}
new GLTFLoader().load('./assets/luminaria_tres_aros.glb', gltf=>{
  const model=gltf.scene;scene.add(model);model.updateMatrixWorld(true);
  const collected=[];
  model.traverse(o=>{if(!o.isMesh)return;const name=o.name.toLowerCase();
    if(name.includes('suspension_')||name.includes('center_electrical_wire'))o.visible=false;
    const match=name.match(/ring_(\d)_/);if(match)collected.push({o,index:Number(match[1])-1});
    if(o.material && /led|crystal|glowing/i.test(o.material.name)){let material=o.material.clone();o.material=material;ledMaterials.push({material,emissive:material.emissive.clone()});}
  });
  ringSpecs.forEach((spec,i)=>{const group=new THREE.Group();group.position.set(0,0,spec.z);model.add(group);model.updateMatrixWorld(true);
    collected.filter(x=>x.index===i).forEach(({o})=>group.attach(o));rings[i]=group;
    for(let j=0;j<spec.count;j++){const theta=2*Math.PI*j/spec.count+spec.offset;const mesh=new THREE.Mesh(cableGeom,cableMaterial);model.add(mesh);cables.push({ring:i,theta,mesh});}
    const light=new THREE.PointLight('#ffe0a2',0,2.5,2);light.position.set(0,0,spec.z-.08);model.add(light);glowLights.push(light);
  });
  // The center power wire remains visible in the horizontal reference, but is omitted in the animated variation.
  for(let i=0;i<3;i++)layoutRing(i);updateCables();updateBrightness();
  document.querySelector('#status').textContent='Modelo 3D listo';setTimeout(()=>{document.querySelector('#status').style.opacity='0';},1400);
},undefined,err=>{document.querySelector('#status').textContent='No se pudo cargar el modelo: abre el proyecto con un servidor local.';console.error(err);});
function chooseMode(mode){targetMode=mode;document.querySelector('#btn-horizontal').classList.toggle('active',mode==='horizontal');document.querySelector('#btn-diagonal').classList.toggle('active',mode==='diagonal');document.querySelector('#btn-horizontal').setAttribute('aria-pressed',String(mode==='horizontal'));document.querySelector('#btn-diagonal').setAttribute('aria-pressed',String(mode==='diagonal'));ringSpecs.forEach((_,i)=>layoutRing(i));}
function updateBrightness(){const val= powered ? Number(document.querySelector('#brightness').value) : 0;
  ledMaterials.forEach(({material,emissive})=>{material.emissive.copy(emissive).multiplyScalar(val);material.needsUpdate=true;});
  glowLights.forEach((light,i)=>{light.intensity=val*[1.3,1.0,.8][i];});
}
document.querySelector('#btn-horizontal').onclick=()=>chooseMode('horizontal');document.querySelector('#btn-diagonal').onclick=()=>chooseMode('diagonal');
document.querySelector('#power').onclick=()=>{powered=!powered;document.querySelector('#power').classList.toggle('off',!powered);document.querySelector('#power').setAttribute('aria-label',powered?'Apagar iluminación':'Encender iluminación');updateBrightness();};
document.querySelector('#brightness').oninput=updateBrightness;
document.querySelector('#reset').onclick=()=>{chooseMode('horizontal');controls.reset();camera.position.set(4.15,-6.2,3.6);controls.target.set(0,0,1.62);document.querySelector('#brightness').value='1.65';powered=true;document.querySelector('#power').classList.remove('off');updateBrightness();};
function onResize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}addEventListener('resize',onResize);onResize();
renderer.setAnimationLoop(()=>{rings.forEach(r=>{if(!r)return;r.rotation.x+=((r.userData.tx??0)-r.rotation.x)*.075;r.rotation.y+=((r.userData.ty??0)-r.rotation.y)*.075;});if(rings.length)updateCables();controls.update();renderer.render(scene,camera);});
</script>
</body></html>
